name: mc-panel

services:
  panel:
    # Le panel se construit depuis GitHub : c'est ce qui permet la mise à jour en un clic.
    # Pour construire depuis ce dossier à la place : PANEL_BUILD_CONTEXT=. dans .env
    build:
      context: ${PANEL_BUILD_CONTEXT:-https://github.com/${PANEL_REPO:-Hokare/Serveur-Minecraft}.git#${PANEL_REF:-${PANEL_TRACK:-main}}}
      args:
        APP_SHA: ${APP_SHA:-}
    image: mc-panel:latest
    container_name: mc-panel
    restart: unless-stopped
    environment:
      PANEL_USER: ${PANEL_USER:-admin}
      # Mot de passe initial (facultatif). Sans lui, les identifiants par défaut sont admin / admin.
      # Dans tous les cas, ils se changent depuis le menu profil de l'interface.
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      PANEL_REPO: ${PANEL_REPO:-Hokare/Serveur-Minecraft}
      PANEL_TRACK: ${PANEL_TRACK:-main}
    ports:
      # Accès de secours en HTTP, depuis le serveur lui-même uniquement (ou via un tunnel SSH).
      - "127.0.0.1:8080:8080"
    volumes:
      # Accès complet à Docker = équivalent root sur l'hôte : garde le mot de passe fort.
      - /var/run/docker.sock:/var/run/docker.sock
      - mc-panel-data:/data        # identifiants du panel
      - .:/project:ro              # permet à l'updater de retrouver ce docker-compose.yml
    networks:
      - mc-net   # permet au panel de « pinger » les serveurs (joueurs, latence)

  # HTTPS pour le réseau local : Caddy chiffre la connexion (mot de passe protégé) et refuse
  # tout ce qui ne vient pas d'une adresse privée (voir le Caddyfile et le README).
  proxy:
    image: caddy:2
    container_name: mc-panel-proxy
    restart: unless-stopped
    depends_on:
      - panel
    environment:
      PANEL_HOSTNAME: ${PANEL_HOSTNAME:-panel.local}
    ports:
      # PANEL_BIND : adresse de la machine sur le réseau local (ex. 192.168.1.50) pour n'écouter que là.
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # conserve l'autorité de certification locale entre les redémarrages
      - caddy-config:/config
    networks:
      - mc-net

volumes:
  mc-panel-data:
  caddy-data:
  caddy-config:

networks:
  mc-net:
    name: mc-net
