<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC Panel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <aside class="rail" id="rail"></aside>
      <section class="panel">
        <header class="panel-head"><h1 id="panel-title">Accueil</h1></header>
        <div class="panel-search"><input id="filter" type="search" placeholder="Filtrer les serveurs…" autocomplete="off"></div>
        <div id="panel-list" class="panel-list"></div>
      </section>
    </nav>
    <div class="main-col">
      <div id="warn" class="warnbar" hidden></div>
      <main id="main" class="main"></main>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v=6"></script>
</body>
</html>
